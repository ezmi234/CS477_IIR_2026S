home_joints: [0.0, -1.5707963268, 1.0, -1.0471975512, -1.5707963268, 0.0]
base_frame: "base_link"
tool_frame: "robotiq_85_base_link"
move_duration: 4.0
startup_wait_timeout: 30.0

motion_profile:
  mode: "competition"
  competition:
    meat_can:
      velocity_scale: 0.75
      acceleration_scale: 0.75
    coke_can:
      velocity_scale: 0.75
      acceleration_scale: 0.75
    strawberry:
      velocity_scale: 0.70
      acceleration_scale: 0.70
    banana:
      velocity_scale: 0.55
      acceleration_scale: 0.55
    hammer:
      velocity_scale: 0.35
      acceleration_scale: 0.35

competition_policy:
  ensure_attempt_for_each_requested_object: true
  min_attempts_per_requested_object: 1
  max_attempts_per_object: 2
  requeue_failed_low_risk_objects: true
  attempt_hammer_last: true
  allow_uncertain_attempt_if_no_better_candidate: true
  min_time_remaining_for_safe_attempt_sec: 45
  stop_if_robot_stuck_sec: 80

object_priority:
  easy_first: ["banana", "meat_can", "coke_can", "strawberry"]
  risky_last: ["hammer"]

hammer_policy:
  attempt_if_requested: true
  attempt_order: "last"
  max_attempts: 1
  require_reachable_candidate: true
  allow_generic_long_object_fallback: true
  allow_depth_cluster_fallback: true
  skip_if_time_remaining_below_sec: 45
  velocity_scale: 0.35
  grasp_strategy: "hammer_handle_grasp"

uncertain_pick_profile:
  velocity_scale: 0.40
  acceleration_scale: 0.40
  approach_height: 0.16
  lift_height: 0.08
  descent_duration: 2.5
  lift_duration: 2.5
  close_force: 0.8
  require_lift_verification: true
  abort_if_no_object_lifted: true

startup:
  move_to_observe_before_first_task: true
  observe_duration: 3.0
  open_gripper_on_start: true

pick:
  approach_height: 0.12
  lift_height: 0.18
  grasp_z_offset: -0.015
  retry_vision_attempts: 3

object_pick:
  meat_can:
    approach_duration: 2.3
    descent_duration: 1.8
    lift_duration: 2.2
    close_timeout: 2.5
  coke_can:
    approach_duration: 2.3
    descent_duration: 1.8
    lift_duration: 2.2
    close_timeout: 2.5
  strawberry:
    approach_duration: 2.4
    descent_duration: 1.8
    lift_duration: 2.2
    close_timeout: 2.5
    approach_height: 0.10
    lift_height: 0.14
    grasp_z_offset: -0.006
  banana:
    approach_height: 0.16
    lift_height: 0.28
    grasp_z_offset: -0.010
    approach_duration: 3.0
    descent_duration: 2.4
    lift_duration: 3.0
    close_timeout: 3.5
    post_close_sleep: 0.35
    use_vision_grasp_orientation: true
  hammer:
    approach_height: 0.16
    lift_height: 0.08
    grasp_z_offset: -0.006
    vision_grasp_z_offset: -0.006
    approach_duration: 3.2
    descent_duration: 2.5
    lift_duration: 2.5
    close_timeout: 3.0
    post_close_sleep: 0.35
    velocity_scale: 0.35
    acceleration_scale: 0.35
    require_lift_verification: true
    abort_if_no_object_lifted: true
    use_vision_grasp_orientation: true

gripper:
  coke_can:
    close_pos: 0.42
    close_timeout: 2.5
  meat_can:
    close_pos: 0.38
    close_timeout: 2.5
  strawberry:
    close_pos: 0.70
    close_timeout: 2.5
  banana:
    close_pos: 0.90
    close_timeout: 3.5
  hammer:
    close_pos: 0.75
    close_timeout: 3.0

dry_run_motion: false
