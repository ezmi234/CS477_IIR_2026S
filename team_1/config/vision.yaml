/**:
  ros__parameters:
    service_name: "detect_objects_with_prompt"

    # For ur5_setup_set2_picking.launch.py the global camera topics are /camera/camera/...
    preferred_camera: "top"
    camera_names: ["top", "wrist"]
    # preferred_only: fixed camera frame; safest for first grasp integration.
    # preferred_then_others: old behavior; try preferred, then fallback.
    # all: evaluate all ready cameras and select the best semantic score.
    camera_selection_mode: "all"
    # Thin/elongated objects are easier to localize geometrically from the
    # global top camera. Other objects still use global multi-camera ranking.
    object_camera_preferences: ["banana:top", "hammer:top"]
    # Clamp unsafe base_link z values generated by noisy depth on thin objects.
    base_grasp_safety: ["banana:-0.040:0.030", "hammer:-0.045:0.040"]

    top_rgb_topic: "/camera/camera/color/image_raw"
    top_cloud_topic: "/camera/camera/depth/color/points"

    wrist_rgb_topic: "/wrist_camera/wrist_camera/color/image_raw"
    wrist_cloud_topic: "/wrist_camera/wrist_camera/depth/color/points"

    # For semantic tests keep fallback disabled, otherwise the depth backend may
    # return a generic object pose and hide zero-shot failures. For a dry-run
    # integration fallback you can temporarily use ["hf_owlvit", "depth"].
    backend_order: ["yolo", "hf_owlvit"]
    future_backend_order: ["yolo", "hf_owlvit"]
    yolo_model_path: "package://manip_challenge/best.pt"
    yolo_conf: 0.10
    grasp_config_file: "grasp.yaml"
    base_frame: "base_link"

    max_camera_age_sec: 30.0
    # Return a zero pose when the best semantic detection is below this score.
    # Keep this low for OWL-ViT in simulation; increase later after evaluation.
    min_return_score: 0.03
    debug: true

    # Optional Hugging Face backend. Keep CPU first to avoid CUDA/PyTorch issues.
    # 0.03 is intentionally low because the simulated images and small objects
    # often produce low OWL-ViT scores. The code ranks aliases and filters boxes.
    device: "cpu"
    hf_model_id: "google/owlvit-base-patch32"
    hf_score_threshold: 0.03

    # Depth fallback params.
    depth_min_area: 250

    grasp:
      default:
        strategy: center_top
        approach_height: 0.12
        surface_depth_offset: 0.0
        min_points: 80
        max_gripper_width: 0.085
        min_candidate_score: 0.12
      banana:
        strategy: banana_mask_distance_transform
        yellow_hsv_lower: [15, 40, 40]
        yellow_hsv_upper: [45, 255, 255]
        min_mask_area: 80
        min_distance_transform: 3.0
        local_window_px: 35
        top_k_candidates: 5
        min_bbox_edge_margin_px: 4
        depth_window_px: 4
        depth_foreground_band_m: 0.09
        candidate_yaw_offsets: [1.5708, -1.5708]
        max_expected_width: 0.06
        min_expected_length: 0.08
        approach_height: 0.13
        surface_depth_offset: 0.0
      hammer:
        strategy: handle_grasp
        candidate_offsets_along_axis: [-0.06, -0.03, 0.0, 0.03, 0.06]
        prefer_thin_segment: true
        avoid_bulky_head: true
        use_largest_cluster: false
        candidate_yaw_offsets: [0.0, 1.5708]
        max_handle_width: 0.045
        approach_height: 0.14
        surface_depth_offset: 0.0
      coke_can:
        strategy: center_top
        prefer_center_top: true
        candidate_yaw_offsets: [0.0]
        aliases: ["cola can", "red soda can"]
      meat_can:
        strategy: center_top
        prefer_center_top: true
        candidate_yaw_offsets: [0.0]
      strawberry:
        strategy: center_top
        prefer_center_top: true
        candidate_yaw_offsets: [0.0]
        approach_height: 0.10
