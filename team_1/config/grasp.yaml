default:
  strategy: center_top
  min_points: 45
  max_gripper_width: 0.085
  max_bbox_area_ratio: 0.70
  max_expected_length: 0.42
  max_expected_width: 0.24
  max_expected_depth_span: 0.32
  max_depth_behind_surface: 0.20
  # Camera-depth offset for the selected RGB-D surface point. Keep close to 0;
  # the motion layer applies the calibrated final z descent.
  surface_depth_offset: 0.0
  min_candidate_score: 0.12
  candidate_yaw_offsets: [0.0, 1.5708]

object_grasp_profiles:
  banana:
    strategy: banana_mask_distance_transform
    close_pos: 0.90
    close_timeout: 3.5
    approach_height: 0.16
    grasp_z_offset: -0.010
    vision_grasp_z_offset: -0.018
    vision_grasp_z_min: -0.080
    vision_grasp_z_max: -0.025
    lift_height: 0.28
    yaw_mode: local_tangent
    risk: medium
    approach_duration: 3.0
    descent_duration: 2.4
    lift_duration: 3.0
    post_close_sleep: 0.35
    use_vision_grasp_orientation: true

  meat_can:
    strategy: can_side_or_top_center
    close_pos: 0.38
    close_timeout: 2.5
    approach_height: 0.12
    grasp_z_offset: -0.010
    lift_height: 0.18
    yaw_mode: symmetric_default
    risk: low
    approach_duration: 2.3
    descent_duration: 1.8
    lift_duration: 2.2

  coke_can:
    strategy: can_side_or_top_center
    close_pos: 0.42
    close_timeout: 2.5
    approach_height: 0.12
    grasp_z_offset: -0.010
    lift_height: 0.18
    yaw_mode: symmetric_default
    risk: low
    approach_duration: 2.3
    descent_duration: 1.8
    lift_duration: 2.2

  strawberry:
    strategy: compact_top_center
    close_pos: 0.70
    close_timeout: 2.5
    approach_height: 0.10
    grasp_z_offset: -0.006
    lift_height: 0.14
    yaw_mode: symmetric_default
    risk: low
    approach_duration: 2.4
    descent_duration: 1.8
    lift_duration: 2.2

  hammer:
    strategy: hammer_handle_grasp
    close_pos: 0.75
    close_timeout: 3.0
    approach_height: 0.14
    grasp_z_offset: -0.006
    vision_grasp_z_offset: -0.006
    vision_grasp_z_min: -0.045
    vision_grasp_z_max: 0.040
    lift_height: 0.12
    yaw_mode: handle_axis
    risk: high
    velocity_scale: 0.45
    acceleration_scale: 0.45
    approach_duration: 3.2
    descent_duration: 2.8
    lift_duration: 3.2
    post_close_sleep: 0.35
    min_candidate_score: 0.25
    min_grasp_score: 0.80
    require_handle_region: true
    skip_if_uncertain: true
    use_vision_grasp_orientation: true

banana:
  strategy: banana_mask_distance_transform
  yellow_hsv_lower: [15, 40, 40]
  yellow_hsv_upper: [45, 255, 255]
  min_mask_area: 80
  min_distance_transform: 2.0
  local_window_px: 35
  top_k_candidates: 7
  min_bbox_edge_margin_px: 4
  depth_window_px: 6
  depth_foreground_band_m: 0.12
  candidate_yaw_offsets: [1.5708, -1.5708]
  max_expected_width: 0.09
  min_expected_length: 0.06
  surface_depth_offset: 0.0
  approach_height: 0.18

hammer:
  strategy: hammer_handle_grasp
  candidate_offsets_along_axis: [0.0]
  candidate_yaw_offsets: [0.0]
  max_handle_width: 0.065
  min_length_width_ratio: 1.85
  min_handle_score: 0.48
  min_candidate_score: 0.25
  min_grasp_score: 0.80
  require_handle_region: true
  skip_if_uncertain: true
  use_largest_cluster: false
  surface_depth_offset: 0.0
  approach_height: 0.14
  lift_height: 0.12

coke_can:
  strategy: can_side_or_top_center
  prefer_center_top: true
  candidate_yaw_offsets: [0.0, 1.5708]
  rim_guard_fraction: 0.22
  upper_body_percentile: 18.0
  max_gripper_width: 0.075
  surface_depth_offset: 0.0
  aliases: ["red cylindrical soda can", "red cola can", "red coke can", "cylindrical red can"]

meat_can:
